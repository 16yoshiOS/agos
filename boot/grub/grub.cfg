# =============================================================================
#  AGOS - GRUB configuration (copied to /boot/grub/grub.cfg on the ISO)
# =============================================================================

set timeout=1
set default=0

# Video drivers for BIOS GRUB (vbe, vga, bochs, ...) so the Multiboot header's
# graphics-mode request (1024x768x32) can be honoured.
insmod all_video

menuentry "AGOS" {
    set gfxpayload=1024x768x32
    multiboot /boot/kernel.elf
    boot
}

# Fallback if a machine cannot set the graphics mode: the kernel then runs in
# 80x25 VGA text mode.
menuentry "AGOS (text mode fallback)" {
    set gfxpayload=text
    multiboot /boot/kernel.elf
    boot
}
